    <div class="max-w-6xl mx-auto px-4 py-8 mt-16">
        <h2 class="text-2xl font-bold mb-6 text-center">Keranjang Belanja</h2>
      
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <!-- Cart Items -->
          <div class="md:col-span-2 space-y-4">
            <!-- Single Item -->
            <div class="flex items-center gap-4 border p-4 rounded-lg shadow-sm">
              
              <div class="flex-1">
                <h3 class="font-semibold text-lg">Nama Produk</h3>
                <p class="text-sm text-gray-500">Rp 0</p>
                <div class="mt-2 flex items-center gap-2">
                  <input type="number" value="1" min="1" class="w-16 px-2 py-1 border rounded" />
                  <button class="text-red-500 hover:underline text-sm">Hapus</button>
                </div>
              </div>
              <div class="text-right font-semibold">Rp 0</div>
            </div>
      
            <!-- Tambah item lain dengan menyalin div di atas -->
          </div>
      
          <!-- Summary -->
          <div class="border p-6 rounded-lg shadow-md bg-gray-50">
            <h3 class="text-xl font-bold mb-4">Ringkasan</h3>
            <div class="flex justify-between mb-2">
              <span>Subtotal</span>
              <span>Rp 0</span>
            </div>
            <div class="flex justify-between mb-2">
              <span>Pajak</span>
              <span>Rp 0</span>
            </div>
            <hr class="my-2" />
            <div class="flex justify-between font-semibold text-lg">
              <span>Total</span> 
              <span>Rp 0</span>
            </div>
            <button class="w-full mt-4 font-bold bg-white text-black outline-black outline-2 py-2 rounded-lg">Checkout</button>
            <button id="clear-cart" class="w-full mt-2 font-bold bg-white text-black outline-black outline-2 py-2 rounded-lg">Kosongkan Keranjang</button>

          </div>
        </div>
      </div>
