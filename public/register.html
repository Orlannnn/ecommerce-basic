<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register - Rice's Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm text-center">
      <h1 class="text-xl font-serif font-semibold mb-1">Rice’s Store</h1>
      <h2 class="text-lg font-bold mb-6">Register</h2>
      
      <form>
        <div class="mb-4 text-left">
          <label for="username" class="block text-gray-700 font-semibold">Nama Depan</label>
          <input id="username" type="text" class="w-full px-4 py-2 border border-black rounded focus:outline-none focus:ring-2 focus:ring-blue-400" required>
        </div>
 <div class="mb-4 text-left">
          <label for="username" class="block text-gray-700 font-semibold">Nama Belakang</label>
          <input id="username" type="text" class="w-full px-4 py-2 border border-black rounded focus:outline-none focus:ring-2 focus:ring-blue-400" required>
        </div>

        <div class="mb-4 text-left">
          <label for="email" class="block text-gray-700 font-semibold">Email</label>
          <input id="email" type="email" class="w-full px-4 py-2 border border-black rounded focus:outline-none focus:ring-2 focus:ring-blue-400" required>
        </div>

        <div class="mb-6 text-left">
          <label for="password" class="block text-gray-700 font-semibold">Password</label>
          <input id="password" type="password" class="w-full px-4 py-2 border border-black rounded focus:outline-none focus:ring-2 focus:ring-blue-400" required>
        </div>

        <button type="submit" class="w-full bg-gray-300 text-black font-bold py-2 rounded hover:bg-gray-400 transition">
          Sign in
        </button>
      </form>

      <p class="mt-6 text-sm">
        Sudah punya akun? 
        <a href="login.html" class="text-blue-600 hover:underline">Login.</a>
      </p>
    </div>
    <script src="register.js"></script>
  </body>
</html>
