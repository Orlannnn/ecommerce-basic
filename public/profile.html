<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<nav></nav>
  <div class="w-full max-w-md bg-white shadow-lg rounded-lg overflow-hidden">
    
    <!-- Header -->
    <div class="bg-gray-800 text-white text-center py-4 border-b border-gray-600 flex items-center justify-center gap-2">
      <h2 class="text-xl font-bold tracking-wide">Edit Profile</h2>
    </div>

    <!-- Profile Form -->
    <form class="flex flex-col items-center p-6 space-y-4">
      
      <!-- Profile Picture -->
      <div class="relative">
        <img src="/aset/download (4).jpeg" alt="Profile Picture" class="w-28 h-28 rounded-full object-cover shadow-md" />
        <label class="absolute bottom-0 right-0 bg-white border border-gray-300 rounded-full p-1 shadow-sm cursor-pointer">
          <input type="file" class="hidden" />
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536M9 11l6-6 3 3-6 6H9v-3z" />
          </svg>
        </label>
      </div>

      <!-- Input Fields -->
      <div class="w-full space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700">Nama</label>
          <input type="text" value="Akira" class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">No Telp</label>
          <input type="text" value="086874659083" class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Alamat</label>
          <input type="text" value="Madrid, Spain" class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" value="orangganteng@gmail.com" class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500" />
        </div>
      </div>

      <!-- Save Button -->
      <button type="submit" class="w-full bg-blue-800 text-white py-2 px-4 rounded-lg hover:bg-blue-900 mt-4">
        Simpan Perubahan
      </button>
      
    </form>
  </div>
<script src="/script/profile.js"></script>

</body>
</html>
