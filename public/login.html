<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Rice's Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white shadow-lg rounded-lg w-full max-w-sm p-8">
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-serif font-bold tracking-wide">Rice’s Store</h1>
      <hr class="my-4">
      <h2 class="text-lg font-semibold">Login</h2>
    </div>

    <!-- Form -->
    <form class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="username">Username</label>
        <input id="username" name="username" type="text" required
          class="w-full border border-black rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email</label>
        <input id="email" name="email" type="email" required
          class="w-full border border-black rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
        <input id="password" name="password" type="password" required
          class="w-full border border-black rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <a href="home.html"><div class="pt-4 text-center">
        <button type="submit" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-black font-semibold py-2 rounded transition">
          Login
        </button>
        </a>
      </div>
    </form>
  </div>
<script src="/script/login.js"></script>
</body>
</html>
